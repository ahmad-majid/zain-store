<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
    video { max-width: 90vw; max-height: 80vh; border: 2px solid #555; }
    .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
    button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Reference Video Inspector</h2>
  <video id="vid" src="/reference_video.mp4" controls autoplay muted></video>
  <div class="controls">
    <button onclick="vid.currentTime = 0">0s</button>
    <button onclick="vid.currentTime = 2">2s</button>
    <button onclick="vid.currentTime = 4">4s</button>
    <button onclick="vid.currentTime = 6">6s</button>
    <button onclick="vid.currentTime = 8">8s</button>
    <button onclick="vid.currentTime = 10">10s</button>
    <button onclick="vid.currentTime = 12">12s</button>
    <button onclick="vid.pause()">Pause</button>
    <button onclick="vid.play()">Play</button>
  </div>
  <p id="curTime">0</p>
  <script>
    const vid = document.getElementById('vid');
    const cur = document.getElementById('curTime');
    setInterval(() => { cur.innerText = 'Time: ' + vid.currentTime.toFixed(1) + 's / ' + vid.duration.toFixed(1) + 's'; }, 200);
  </script>
</body>
</html>
